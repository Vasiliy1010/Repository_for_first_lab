<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Архив Магических Миссий</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-center mb-4">Реестр магических миссий</h1>
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Загрузить новую миссию</h5>
            <form th:action="@{/missions/upload}" method="post" enctype="multipart/form-data" class="row g-3">
                <div class="col-auto">
                    <input type="file" name="file" class="form-control" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Импортировать</button>
                </div>
            </form>
        </div>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Проклятье</th>
                    <th>Статус миссии</th>
                    <th>Участники</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${missions}">
                    <td th:text="${m.id}"></td>
                    <td th:text="${m.missionId}"></td>
                    <td th:text="${m.curse != null ? m.curse.name : 'N/A'}"></td>
                    <td>
                        <span class="badge"
                            th:classappend="${m.outcome == 'SUCCESS' ? 'bg-success' : 'bg-danger'}"
                            th:text="${m.outcome}"></span>
                    </td>
                    <td>
                        <span th:each="s, iterStat : ${m.sorcerers}"
                            th:text="${s.name} + ${!iterStat.last ? ', ' : ''}">
                        </span>
                        <span th:if="${#lists.isEmpty(m.sorcerers)}">Нет участников</span>
                    </td>
                    <td>
                        <a th:href="@{/missions/report/{id}(id=${m.id})}" class="btn btn-sm btn-outline-info">Отчет</a>
                        <a th:href="@{/missions/edit/{id}(id=${m.id})}" class="btn btn-sm btn-outline-warning">Изменить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
