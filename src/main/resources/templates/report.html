<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отчет по миссии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Детальный отчет по миссии #<span th:text="${missionId}"></span></h2>
        <a href="/missions" class="btn btn-secondary">Назад к списку</a>
    </div>
    <div class="btn-group mb-4" role="group">
        <a th:href="@{/missions/report/{id}(id=${missionId}, type='small')}"
           class="btn btn-outline-primary" th:classappend="${currentType == 'small' ? 'active' : ''}">Маленький</a>
        <a th:href="@{/missions/report/{id}(id=${missionId}, type='medium')}"
           class="btn btn-outline-primary" th:classappend="${currentType == 'medium' ? 'active' : ''}">Средний</a>
        <a th:href="@{/missions/report/{id}(id=${missionId}, type='large')}"
           class="btn btn-outline-primary" th:classappend="${currentType == 'large' ? 'active' : ''}">Большой</a>
    </div>
    <div class="card shadow">
        <div class="card-body p-0">
            <pre class="bg-dark text-white p-4 m-0"
                 style="font-family: 'Courier New', monospace; font-size: 1.1rem; line-height: 1.5;"
                 th:text="${reportText}"></pre>
        </div>
    </div>
</div>
</body>
</html>
